<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Red Planet Outpost: a Mars base survival game for ages 7–12, built on NASA data. Keep 4 crew alive from sunrise to sunrise.">
<meta name="author" content="Kqetlyn">
<meta name="generator" content="Claude (Anthropic AI assistant), directed and tested by the team">
<meta name="ai-generated" content="true">
<meta name="ai-disclosure" content="Built with AI assistance: the code (HTML, CSS, JavaScript), the in-game text and the code-drawn graphics were generated with Claude, an AI assistant made by Anthropic. Our team came up with the idea, chose the features, levels and trade-offs, played and tested every version, and directed each change. Numbers come from the NASA sources listed in the game. No NASA logos or branding are used.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Planet Outpost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a night-indigo mission console on top, a living full-width Mars scene below that you play by tapping */
  --void:#0c0a1d; --console:#15122a; --console2:#1f1a3b; --line:#342d57;
  --ink:#f7efe4; --muted:#b9aecd; --rust:#e0703f; --solar:#ffc94a; --signal:#62d6e8;
  --alarm:#ff5468; --ok:#6be3a4;
  --c-heat:#ff9a52; --c-air:#8fd8ff; --c-lamps:#ff7ad9; --c-lab:#b79cff; --c-dish:#62d6e8; --c-shelter:#6aa8ff; --c-repair:#ffd166;
  --display:"Chakra Petch","Trebuchet MS",sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--solar);outline-offset:2px}
h1,h2,h3,.disp{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}
.hidden{display:none!important}

#app{display:flex;flex-direction:column;height:100%}
/* ---- top bar ---- */
.bar{display:flex;align-items:center;gap:10px 16px;padding:8px 16px;background:var(--console);border-bottom:1px solid var(--line);flex-wrap:wrap}
.solbadge{display:flex;align-items:baseline;gap:10px}
.solbadge .sol{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--rust);text-transform:uppercase;letter-spacing:.12em}
.solbadge .lvl{font-family:var(--display);font-weight:600;font-size:1.2rem}
.clock{display:flex;align-items:baseline;gap:8px;margin-left:auto}
.clock .time{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.clock .tz{font-size:.8rem;color:var(--muted)}
.clock .temp{font-family:var(--display);font-size:1rem;color:var(--c-air);font-variant-numeric:tabular-nums}
.speed{display:flex;gap:4px;background:#0006;border:1px solid var(--line);border-radius:10px;padding:3px}
.speed button{border:0;background:transparent;border-radius:7px;padding:6px 10px;min-width:42px;font-family:var(--display);font-weight:600}
.speed button[aria-pressed=true]{background:var(--rust);color:#1b0b04}
.iconbtn{border:1px solid var(--line);background:var(--console2);border-radius:10px;padding:7px 12px;font-size:.92rem}

/* ---- HUD ---- */
.hud{display:grid;grid-template-columns:1.45fr 1.55fr 1.45fr 1fr 1fr;gap:8px;padding:8px 16px;background:var(--console);border-bottom:1px solid var(--line)}
.hud.dose{grid-template-columns:1.35fr 1.45fr 1.35fr 1fr 1fr 1fr}
.tile{background:var(--console2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.tile .k{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;gap:6px}
.tile .v{font-family:var(--display);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .v small{font-size:.8rem;color:var(--muted);font-weight:500}
.tile .s{font-size:.82rem;color:var(--muted)}
.tile.warn{border-color:var(--alarm);box-shadow:inset 0 0 0 1px var(--alarm)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:5px 0 4px}
.cells i{height:14px;border-radius:3px;border:1.5px solid var(--solar);background:transparent;transition:background .3s}
.cells i.on{background:var(--solar)}
.cells i.half{background:linear-gradient(90deg,var(--solar) 50%,transparent 50%)}
.cells.low i{border-color:var(--alarm)} .cells.low i.on{background:var(--alarm)}
.cells i.flash{animation:cellflash .9s ease-out 2}
@keyframes cellflash{50%{background:#fff;border-color:#fff}}
.pred{font-size:.85rem;font-weight:700;margin-top:2px}
.pred.good{color:var(--ok)} .pred.bad{color:var(--alarm)}
.flowbars{display:grid;grid-template-columns:92px 1fr auto;gap:3px 8px;align-items:center;font-size:.8rem;margin-top:3px}
.fb{height:11px;background:#0007;border-radius:4px;overflow:hidden;display:flex}
.fb span{display:block;height:100%}
.fbv{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:58px}
.net{font-family:var(--display);font-weight:700;font-size:.92rem;margin-top:3px}
.net.up{color:var(--ok)} .net.down{color:var(--alarm)}
.crewair{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:5px 0 3px}
.ca{display:flex;align-items:center;gap:4px}
.ca svg{flex:0 0 auto}
.ca span{flex:1;height:12px;border-radius:4px;border:1.5px solid var(--c-air);overflow:hidden;background:#0007}
.ca i{display:block;height:100%;background:var(--c-air);transition:width .3s}
.ca.full span{box-shadow:0 0 8px var(--c-air)}
.meter{height:8px;background:#0007;border-radius:4px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:4px;transition:width .3s}

/* ---- stage ---- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#140e1c}
#scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.bld{cursor:pointer}
.bld:focus{outline:none}
.bld:focus-visible .tagbox{stroke:var(--solar);stroke-width:3}
.bld:hover .tagbox{filter:brightness(1.25)}
.tagbox{transition:fill .25s,stroke .25s}
.tagname{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;fill:var(--ink)}
.tagval{font-family:var(--display);font-weight:600;font-size:15px;fill:var(--muted)}
.tap{cursor:pointer}
.stage.alarm::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 10px #ff2d6faa;animation:alarm 1.2s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:inset 0 0 40px 2px #ff2d6f44}}

/* scene animations (CSS on SVG) */
.bub{opacity:0}
.on .bub{animation:bub 1.6s linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-44px);opacity:0}}
.led{opacity:.25}
.on .led{animation:blink 0.9s steps(2) infinite}
@keyframes blink{50%{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center}
.on .spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{opacity:0;transform-box:fill-box;transform-origin:left center}
.on .wave{animation:wave 1.4s ease-out infinite}
.on .wave.w2{animation-delay:.45s}.on .wave.w3{animation-delay:.9s}
@keyframes wave{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
.sway{transform-box:fill-box;transform-origin:bottom center;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(4deg)}}
.devilspin{transform-box:fill-box;transform-origin:bottom center;animation:devil .5s ease-in-out infinite alternate}
@keyframes devil{to{transform:skewX(-8deg) scaleX(1.06)}}
.streak{animation:streak 0.9s linear infinite}
@keyframes streak{from{transform:translate(0,0)}to{transform:translate(-140px,40px)}}
.zap{animation:zap 0.7s linear infinite}
@keyframes zap{from{transform:translate(0,-60px)}to{transform:translate(-90px,420px)}}
.beam{stroke-dasharray:10 12;animation:beam .6s linear infinite}
@keyframes beam{to{stroke-dashoffset:-22}}
.beacon{animation:blink .6s steps(2) infinite}
.float{animation:floatup 1.4s ease-out forwards;font-family:var(--display);font-weight:700;font-size:22px}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-50px);opacity:0}}
.spark{animation:spark .5s ease-out infinite}
@keyframes spark{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
/* crew */
.leg,.arm{transform-box:fill-box;transform-origin:top center}
.walking .leg.l{animation:stepA .32s ease-in-out infinite alternate}
.walking .leg.r{animation:stepB .32s ease-in-out infinite alternate}
.walking .bodyg{animation:bob .32s ease-in-out infinite alternate}
@keyframes stepA{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
@keyframes stepB{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes bob{to{transform:translateY(-2px)}}
.working .arm{animation:work .22s ease-in-out infinite alternate}
@keyframes work{from{transform:rotate(-20deg)}to{transform:rotate(-150deg)}}
.cheer .arm{transform:rotate(-170deg)}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:linear-gradient(transparent,#0c0a1dcc 40%)}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#15122ae6;border-radius:12px;padding:6px 12px;min-height:46px;text-align:left}
.chip b{font-family:var(--display);font-weight:700;letter-spacing:.04em}
.chip small{display:block;color:var(--muted);font-size:.78rem}
.chip .dot{width:12px;height:12px;border-radius:50%;background:#5a5470;flex:0 0 auto}
.chip.on{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 18%,#15122a)}
.chip.on .dot{background:var(--sc);box-shadow:0 0 10px var(--sc)}
.chip.auto{cursor:default;opacity:.92}
.chip.pending{border-style:dashed}

/* toasts */
#toasts{position:absolute;top:12px;right:16px;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100% - 32px));pointer-events:none;z-index:5}
.toast{pointer-events:auto;background:#15122af2;border:1px solid var(--line);border-left:5px solid var(--signal);border-radius:12px;padding:10px 12px;font-size:.95rem;box-shadow:0 10px 30px #0008;animation:tin .35s ease-out}
.toast.bad{border-left-color:var(--alarm)} .toast.good{border-left-color:var(--ok)} .toast.sun{border-left-color:var(--solar)} .toast.hint{border-left-color:var(--rust);background:#2a1726f2}
.toast b{font-family:var(--display)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}

/* ---- thought bubbles ---- */
#bubbles{position:absolute;inset:0;pointer-events:none;z-index:4}
.bubble{position:absolute;max-width:250px;background:#fffaf0;color:#2a1a10;border-radius:24px;padding:10px 15px;font-size:.98rem;line-height:1.32;box-shadow:0 8px 24px #0007;animation:bpop .35s cubic-bezier(.2,1.5,.4,1);transform-origin:20% 100%}
.bubble::before,.bubble::after{content:"";position:absolute;background:#fffaf0;border-radius:50%;box-shadow:0 4px 10px #0004}
.bubble::before{width:16px;height:16px;left:calc(var(--tx,30px) - 8px);bottom:-14px}
.bubble::after{width:9px;height:9px;left:calc(var(--tx,30px) - 12px);bottom:-27px}
.bubble.below{transform-origin:20% 0}
.bubble.below::before{bottom:auto;top:-14px}.bubble.below::after{bottom:auto;top:-27px}
.bubble.out{opacity:0;transform:scale(.8);transition:opacity .22s,transform .22s}
@keyframes bpop{from{transform:scale(.5);opacity:0}}
/* ---- coach ---- */
#coach{position:absolute;left:16px;top:12px;z-index:6;max-width:460px;display:flex;gap:12px;align-items:flex-start;background:#fffaf0;color:#24160e;border-radius:18px;padding:14px 16px;box-shadow:0 14px 40px #000b;border:3px solid var(--solar);animation:bpop .35s cubic-bezier(.2,1.4,.4,1)}
#coach .mc{flex:0 0 48px;height:48px;border-radius:50%;background:var(--console);display:grid;place-items:center;font-size:1.5rem}
#coach .who{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#b4521f}
#coach p{margin:3px 0 10px;font-size:1.08rem;line-height:1.38}
#coach .acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#coach .btn{padding:8px 18px;min-height:42px;font-size:1rem}
#coach .paused{font-size:.82rem;color:#7a5a48;font-weight:700}
#coach .skip{background:none;border:0;color:#7a5a48;text-decoration:underline;font-size:.82rem;padding:4px}
#coachRing{position:fixed;z-index:7;pointer-events:none;border:4px solid var(--solar);border-radius:16px;box-shadow:0 0 0 4px #ffc94a44,0 0 30px #ffc94a;animation:ring 1.1s ease-in-out infinite}
#coachRing::before{content:"▼";position:absolute;left:50%;top:-36px;transform:translateX(-50%);color:var(--solar);font-size:28px;text-shadow:0 2px 6px #000;animation:bounce .55s ease-in-out infinite alternate}
@keyframes ring{50%{box-shadow:0 0 0 10px #ffc94a1a,0 0 44px #ffc94a}}
@keyframes bounce{to{transform:translate(-50%,-9px)}}
.concept{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center;margin:12px 0}
.concept div{background:var(--console2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:.92rem;color:var(--muted)}
.concept span{display:block;font-size:1.7rem}
.concept b{display:block;font-family:var(--display);color:var(--ink);font-size:1.05rem}
.concept i{font-style:normal;color:var(--rust);font-size:1.4rem;font-weight:700}

/* ---- modals ---- */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;background:#07051299}
.modal.title{background:linear-gradient(90deg,#0c0a1df2 0%,#0c0a1dcc 45%,#0c0a1d33 100%);justify-content:flex-start;align-items:center}
.box{background:var(--console);border:1px solid var(--line);border-radius:18px;max-width:720px;width:100%;padding:22px;box-shadow:0 20px 60px #000a}
.box h2{font-size:1.7rem;margin-bottom:6px}
.box p{margin:8px 0;max-width:65ch}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:.82rem;color:var(--rust);font-weight:700}
.btn{border:0;border-radius:12px;background:var(--rust);color:#1b0b04;font-family:var(--display);font-weight:700;font-size:1.05rem;padding:12px 20px;min-height:48px;letter-spacing:.03em}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row.end{justify-content:flex-end}
.newbox{display:flex;gap:12px;align-items:flex-start;background:var(--console2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.newbox .tag{font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;background:var(--solar);color:#1b0b04;border-radius:6px;padding:3px 7px;white-space:nowrap}
.tipbox{background:#2a1726;border:1px solid #6b3045;border-radius:12px;padding:12px;margin:12px 0}
.tipbox .eyebrow{color:var(--c-lamps)}
.goals{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.goals li{display:flex;gap:10px;align-items:center}
.goals .st{font-size:1.25rem;width:26px;text-align:center;color:var(--solar)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choice button{text-align:left;background:var(--console2);border:2px solid var(--line);border-radius:14px;padding:14px}
.choice button:hover{border-color:var(--rust)}
.choice b{font-family:var(--display);font-size:1.1rem;display:block;margin-bottom:4px}
.choice small strong{color:var(--ink)}
.choice small{color:var(--muted);font-size:.92rem}
.fact{border-left:5px solid var(--solar);background:var(--console2);border-radius:10px;padding:12px 14px;margin:12px 0}
.fact .src{display:block;margin-top:6px;font-size:.8rem;color:var(--muted)}
.stars{font-size:2.6rem;letter-spacing:6px;color:var(--solar)}
.stars .off{color:#4a4366}
/* title */
.titlebox{max-width:560px;background:transparent;border:0;box-shadow:none;padding:12px}
.titlebox h1{font-size:clamp(2.6rem,6vw,4.4rem);line-height:.95;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.titlebox h1 span{display:block;color:var(--rust)}
.lead{font-size:1.1rem;color:var(--muted);max-width:52ch}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.diff button{text-align:left;background:var(--console2);border:2px solid var(--line);border-radius:14px;padding:12px}
.diff button[aria-pressed=true]{border-color:var(--rust);background:#2b1a2a}
.diff b{font-family:var(--display);font-size:1.1rem}
.diff small{display:block;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{background:var(--console2);border:2px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.lv .n{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--rust)}
.lv .nm{font-size:.82rem;display:block;min-height:2.3em;line-height:1.15}
.lv .ss{color:var(--solar);font-size:.9rem;letter-spacing:2px}
.lv:disabled{opacity:.4}
.linkbtn{background:none;border:0;color:var(--signal);text-decoration:underline;padding:4px 0;font-size:.9rem}
table.src{width:100%;border-collapse:collapse;font-size:.9rem}
table.src th,table.src td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.src th{color:var(--muted)}
.tg{display:inline-block;font-size:.72rem;padding:2px 7px;border-radius:999px;font-weight:700;white-space:nowrap;font-family:var(--display);letter-spacing:.06em}
.tg.real{background:#13372d;color:var(--ok)} .tg.approx{background:#3b3214;color:var(--solar)} .tg.rule{background:#2d2550;color:#c9b8ff} .tg.calc{background:#14304a;color:var(--signal)}
.chartwrap{overflow-x:auto;margin:12px 0}
.chart text{font-family:var(--display);font-size:12px;fill:var(--muted)}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.sumgrid div{background:var(--console2);border-radius:10px;padding:8px 10px}
.sumgrid b{display:block;font-family:var(--display);font-size:1.2rem}
.sumgrid small{color:var(--muted)}

/* ---- big science counter ---- */
#sciBig{position:absolute;top:12px;left:calc(50% - 50px);transform:translateX(-50%);z-index:3;display:flex;align-items:stretch;gap:12px;background:#15122af2;border:2px solid var(--c-lab);border-radius:18px;padding:10px 14px 10px 16px;box-shadow:0 10px 30px #0009,0 0 24px #b79cff33;min-width:360px}
#sciBig .sb-k{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c-lab)}
#sciBig .sb-row{display:flex;align-items:baseline;gap:8px}
#sciBig .sb-num{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1;color:var(--solar);font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left bottom}
#sciBig .sb-num.pop{animation:sbpop .6s cubic-bezier(.2,1.6,.4,1)}
#sciBig .sb-num.drop{animation:sbdrop .7s ease-out}
@keyframes sbdrop{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px);color:#ff5468}40%{transform:translateX(6px);color:#ff5468}60%{transform:translateX(-4px)}}
@keyframes sbpop{0%{transform:scale(1)}35%{transform:scale(1.35);color:#fff}100%{transform:scale(1)}}
#sciBig .sb-unit{font-size:.95rem;color:var(--muted)}
#sciBig .sb-goal{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-top:4px}
#sciBig .sb-goal .meter{flex:1;margin:0;height:10px;min-width:90px}
#sciBig .sb-side{display:flex;flex-direction:column;justify-content:center;gap:5px;border-left:1px solid var(--line);padding-left:12px;max-width:200px}
#sciBig .sb-stat{min-width:112px}
#sciBig .sb-k{white-space:nowrap}
#sciBig .sb-goal span{white-space:nowrap}
#sciBig .sb-mini{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);margin-top:3px}
#sciBig .sb-mini .meter{flex:1;min-width:50px}
#sciBig .sb-arrow{align-self:center;font-size:1.8rem;color:#5a5470;font-weight:700}
#sciBig .sb-arrow.flow{color:var(--signal);animation:flow .7s linear infinite}
@keyframes flow{0%{transform:translateX(-6px);opacity:.4}60%{opacity:1}100%{transform:translateX(8px);opacity:.4}}

  .chip{min-height:40px;padding:4px 10px}

  #sciBig{flex-wrap:wrap} #sciBig .sb-num{font-size:2.2rem} #sciBig .sb-side{max-width:none;flex:1 1 100%;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:6px} #sciBig .sb-stat{flex:1}

}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}

<body>
<div id="app">
  <header class="bar">
    <div class="solbadge"><span class="sol" id="solLbl">Sol 1</span><span class="lvl" id="lvlLbl">Sunrise to sunrise</span></div>
    <div class="clock"><span class="time" id="clock">06:00</span><span class="tz">Mars time</span><span class="temp" id="temp">−82 °C outside</span></div>
    <div class="speed" role="group" aria-label="Game speed">
      <button data-sp="0" aria-pressed="false" aria-label="Pause">❚❚</button>
      <button data-sp="1" aria-pressed="true">1×</button>
      <button data-sp="2" aria-pressed="false">2×</button>
      <button data-sp="4" aria-pressed="false">4×</button>
    </div>
    <button class="iconbtn" id="goalsBtn">Goals</button>
    <button class="iconbtn" id="menuBtn">Menu</button>
  </header>
  <section class="hud" id="hud"></section>
  <main class="stage" id="stage">
    <svg id="scene" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Your Mars base in Jezero Crater"></svg>
    <div id="sciBig" class="hidden" aria-label="Science">
      <div class="sb-stat" id="sbLabStat">
        <div class="sb-k" id="sbLabK">🔬 In the lab</div>
        <div class="sb-row"><span class="sb-num" id="sbLab">0</span><span class="sb-unit" id="sbLabUnit">waiting to send</span></div>
        <div class="sb-mini"><div class="meter sm"><i id="sbFrac" style="width:0%;background:var(--c-lab)"></i></div><span>next point</span></div>
        <div class="sb-goal" id="sbGoalLabWrap"><div class="meter"><i id="sbBarLab" style="width:0%;background:var(--solar)"></i></div><span id="sbGoalLab"></span></div>
      </div>
      <div class="sb-arrow" id="sbArrow" aria-hidden="true">➜</div>
      <div class="sb-stat" id="sbSentStat">
        <div class="sb-k" style="color:var(--signal)">📡 Sent home</div>
        <div class="sb-row"><span class="sb-num" id="sbSent">0</span><span class="sb-unit">points</span></div>
        <div class="sb-mini" id="sbPass">next satellite 15:00</div>
        <div class="sb-goal" id="sbGoalSentWrap"><div class="meter"><i id="sbBarSent" style="width:0%;background:var(--solar)"></i></div><span id="sbGoalSent"></span></div>
      </div>
      <div class="sb-side"><button class="mgbtn" id="mgBtn" disabled>🔬 Do an experiment</button>
        <div class="sb-sub" id="sbSub">Switch on the lab to collect rock samples.</div>
        <div class="meter sm" title="Next sample"><i id="sbNext" style="width:0%;background:var(--c-lab)"></i></div>
        <div class="sb-rw" id="sbRw"></div></div>
    </div>
    <div id="bubbles"></div>
    <div id="coach" class="hidden" role="status" aria-live="polite"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="aiMark">🤖 AI-generated with Claude · graphics drawn by code</div>
    <div class="dock" id="dock" aria-label="Base systems"></div>
  </main>
</div>
<div id="coachRing" class="hidden" aria-hidden="true"></div>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="box" id="box"></div></div>
<script>
/* ===== MODEL: pure functions, shared by the page and the balance test ===== */
const M = {
  peakKW: 30,            // solar farm output at noon, clear sky, clean panels (game scale)
  habBaseKW: 1.5,        // computers, fans, water pumps, cabin lights
  heatK: 0.06,           // kW of heating per degree C of difference to 20 C inside
  insideC: 20,
  airKW: 3, airMake: 0.28,          // kg O2 per Mars hour: 12 sunny hours = 3.36 kg = one sol for 4 crew
  crewO2: 4 * 0.84 / 24,            // 4 crew x 0.84 kg per sol (NASA design value)
  tankMax: 8,
  lampKW: 5, lightNeed: 12,         // hours of light plants want per sol
  labKW: 4, labRate: 0.6,           // science per Mars hour (before it slows through the sol)
  dishKW: 1.5, sendRate: 12,        // science sent per Mars hour of satellite pass
  shelterKW: 3,
  repairKW: 10, repairHours: 1.5,   // fixing it yourselves: fast, but a big power draw (welder, 3D printer, pumps)
  brokenEff: 0.25,                  // a broken air maker makes only 25% of its normal air, less than the crew breathes
  earthWait: 10,                    // Earth's engineers need about 10 Mars hours to test a fix on their twin base
  outsideDose: 0.12,                // share of the storm dose added to the crew average while one of 4 crew works outside
  radBase: 0.67 / 24,               // mSv per Mars hour, Curiosity RAD
  stormDose: 8.1,                   // mSv-equivalent, RAD 20 May 2024 (8,100 microgray)
  doseLimit: 4,
  cap: { cadet: 150, commander: 120 }
};
/* Research rewards: when enough science reaches Earth, Mission Control sends an upgrade for the rest of the sol */
const REWARDS = [
  { at:4,  key:"brush",  icon:"🧹", name:"Panel brush",        desc:"Solar panels make 10% more power" },
  { at:8,  key:"insul",  icon:"🧥", name:"Heater insulation",  desc:"Heaters use 15% less power" },
  { at:12, key:"pack",   icon:"🔋", name:"Spare battery pack", desc:"20 kWh more battery, already charged" },
  { at:16, key:"filter", icon:"🫧", name:"Air maker upgrade",  desc:"Air maker makes 20% more air" }
];
// Typical clear sol at Jezero, shaped to Perseverance MEDA ranges (high about -22 C, low about -83 C)
const TEMP = [-74,-77,-79,-81,-83,-84,-82,-71,-59,-48,-39,-32,-27,-24,-22,-23,-27,-34,-45,-55,-61,-65,-69,-72];
// Share of clear-sky sunlight vs dust opacity tau, shaped to Opportunity 2018 (645 Wh -> 22 Wh at tau 10.8)
const SUNCURVE = [[0,1],[0.5,1],[1,0.9],[1.5,0.8],[2,0.68],[3,0.5],[4,0.37],[5,0.27],[6,0.2],[8,0.11],[10.8,0.04]];

function lerpTable(c, x){ if (x <= c[0][0]) return c[0][1];
  for (let i = 1; i < c.length; i++) if (x <= c[i][0]) { const [a,fa]=c[i-1],[b,fb]=c[i]; return fa+(fb-fa)*(x-a)/(b-a); }
  return c[c.length-1][1]; }
const dustFactor = tau => lerpTable(SUNCURVE, tau);
// Lab science per hour drops through the sol: the easy rocks near the base get studied first
const labFactor = t => 1 - 0.5 * Math.pow(Math.min(1, Math.max(0, (t - 6) / 24)), 1.5);
const hourOf = t => ((t % 24) + 24) % 24;
const sunElev = h => Math.max(0, Math.sin(Math.PI * (h - 6) / 12));
function tempAt(h, storm){ const i=Math.floor(h), f=h-i; const c=TEMP[i%24]+(TEMP[(i+1)%24]-TEMP[i%24])*f;
  // dust storms shrink the day-night swing: cooler days, warmer nights
  return -55 + (c + 55) * (1 - 0.55 * storm); }

/* Levels: each sol runs from 06:00 (t=6) to 06:00 next sol (t=30) */
function ramp(t, t0, t1, a, b){ if (t <= t0) return a; if (t >= t1) return b; return a + (b-a)*(t-t0)/(t1-t0); }
const LEVELS = [
  { n:1, key:"sunrise", name:"Sunrise to sunrise", dish:false, shelter:false,
    tau: t => 0.6, storm: t => 0, start:{ bat:{cadet:0.55, commander:0.45}, air:4, panel:1 },
    goals:[ {k:"airMade", v:3.36, label:"Make air for all 4 crew (3.36 kg)"}, {k:"made", v:6, label:"Make 6 science points"} ] },
  { n:2, key:"phone", name:"Phone home", dish:true, shelter:false,
    tau: t => 0.65, storm: t => 0, start:{ bat:{cadet:0.5, commander:0.42}, air:4, panel:1 },
    goals:[ {k:"sent", v:6, label:"Send 6 science points home"}, {k:"light", v:12, label:"Give the plants 12 hours of light"} ] },
  { n:3, key:"dust", name:"Dust storm", dish:true, shelter:false,
    tau: t => t < 11.5 ? 0.6 : ramp(t, 11.5, 13, 0.6, 4.6), storm: t => ramp(t, 11.5, 13, 0, 1),
    dustWarnAt: 9.5, arriveAt: 12, start:{ bat:{cadet:0.6, commander:0.56}, air:4, panel:1 },
    goals:[ {k:"airMade", v:3.36, label:"Make air for all 4 crew (3.36 kg)"}, {k:"batPct", v:15, label:"Finish the sol with at least 15% battery"} ] },
  { n:4, key:"break", name:"Breakdown", dish:true, shelter:false,
    tau: t => ramp(t, 6, 16, 1.6, 0.8), storm: t => ramp(t, 6, 16, 0.35, 0),
    devilAt: 11.5, breakAt: 16, start:{ bat:{cadet:0.62, commander:0.74}, air:2.5, panel:0.75 },
    goals:[ {k:"airBy", v:24, label:"Make air for all 4 crew before midnight"}, {k:"batPct", v:15, label:"Finish the sol with at least 15% battery"} ] },
  { n:5, key:"flare", name:"Everything at once", dish:true, shelter:true,
    tau: t => t < 11 ? 0.6 : ramp(t, 11, 12.5, 0.6, 3.4), storm: t => ramp(t, 11, 12.5, 0, 0.8),
    dustWarnAt: 9, arriveAt: 11.5, warnAt: 12.5, particlesAt: 13.5, particlesEnd: 19.5, breakAt: 14,
    start:{ bat:{cadet:0.75, commander:0.86}, air:3.2, panel:1 },
    goals:[ {k:"dose", v:2, label:"Keep the crew dose under 2 mSv"}, {k:"airBy", v:24, label:"Make air for all 4 crew before midnight"} ] }
];
const PASSES = [[15,16],[27,28]]; // satellite overhead 15:00-16:00 and 03:00-04:00
const goalVal = (S, k) => k === "light" ? S.light : k === "made" ? S.made : k === "sent" ? S.sent : k === "air" ? S.air : k === "airMade" ? S.airMade
  : k === "batPct" ? S.bat / S.cap * 100 : k === "fixedAt" ? (S.fixedAt === undefined ? null : S.fixedAt) : k === "airBy" ? (S.airFullAt === undefined ? null : S.airFullAt) : S.dose;
// "dose" and "fixedAt" goals are met by staying at or under the value; the rest by reaching it
function goalMet(S, Gl){ const v = goalVal(S, Gl.k); if (Gl.k === "fixedAt" || Gl.k === "airBy") return v !== null && v <= Gl.v; return Gl.k === "dose" ? v <= Gl.v : v >= Gl.v; }
function goalNow(S, Gl){ const v = goalVal(S, Gl.k);
  if (Gl.k === "dose") return v.toFixed(2) + " mSv";
  if (Gl.k === "batPct") return Math.round(v) + "%";
  if (Gl.k === "airBy") return v !== null ? "all 4 full at " + String(Math.floor(v % 24)).padStart(2, "0") + ":" + String(Math.floor((v % 1) * 60)).padStart(2, "0") : `${(Math.round(S.airMade * 100) / 100).toFixed(2)} of ${(M.crewO2 * 24).toFixed(2)} kg`;
  if (Gl.k === "fixedAt") return v !== null ? "fixed at " + String(Math.floor(v % 24)).padStart(2, "0") + ":" + String(Math.floor((v % 1) * 60)).padStart(2, "0") : (S.L.breakAt && S.t >= S.L.breakAt ? "still broken" : "not broken yet");
  return (Math.round(v * 10) / 10).toFixed(1); }
const inPass = t => PASSES.some(([a,b]) => t >= a && t < b);
// Science that counts towards rewards: what has reached Earth (or what was made, on Sol 1 with no dish)
const sciScore = S => S.L.dish ? S.sent : S.made;
// Particle storm dose rate (mSv per Mars hour): fast rise, slow fall; integrates to stormDose
function stormRate(L, t){ if (!L.particlesAt || t < L.particlesAt || t >= L.particlesEnd) return 0;
  const d = L.particlesEnd - L.particlesAt, x = (t - L.particlesAt) / d; // 0..1
  const shape = x < 0.15 ? x / 0.15 : (1 - x) / 0.85;                    // triangle peak at 15%
  return M.stormDose * 2 / d * shape; }

function newState(L, diff){

/* ===================== crew ===================== */
const DOOR_X = 560, WALK_Y = 474, CREW_SPEED = 320;
const SPOT = { air:400, lamps:742, lab:900, dish:1072, shelter:476, repair:404 };
const crew = [];
function crewSVG(i, cmd){
  const stripe = cmd ? "#4f8cff" : "#ff8a3d";
  const badge = cmd ? `<path d="M-3 -24 l1.2 2.6 2.8 .3 -2.1 1.9 .6 2.8 -2.5 -1.4 -2.5 1.4 .6 -2.8 -2.1 -1.9 2.8 -.3z" fill="#ffd166"/>` : `<circle cx="-2" cy="-21" r="2.2" fill="#ff8a3d"/>`;
  return `<g class="flip"><g class="bodyg">
    <rect class="leg l" x="-7" y="-15" width="6" height="16" rx="3" fill="#e4dfd4"/><rect class="leg r" x="1" y="-15" width="6" height="16" rx="3" fill="#d4cec2"/>
    <rect x="-15" y="-41" width="8" height="19" rx="3" fill="#bdb6a8"/>
    <rect x="-9" y="-42" width="18" height="29" rx="7" fill="#f6f3ec"/><rect x="-9" y="-31" width="18" height="4" fill="${stripe}"/>${badge}
    <rect class="arm" x="4" y="-40" width="5" height="16" rx="2.5" fill="#ece7dd"/>
    <circle cx="0" cy="-51" r="11.5" fill="#fff" stroke="#d8d2c6"/><ellipse cx="3.6" cy="-51" rx="7.4" ry="6.2" fill="url(#visorG)"/>
    <ellipse cx="6" cy="-54" rx="2" ry="1.3" fill="#fff" opacity=".7"/></g></g>`;
}
function setupCrew(){
  const layer = $("#crewLayer"); layer.innerHTML = ""; crew.length = 0;
  const cmd = G.diff === "commander";
  for (let i = 0; i < 4; i++){
    const g = document.createElementNS(SVGNS, "g"); g.setAttribute("class","crew"); g.innerHTML = crewSVG(i, cmd); g.style.opacity = 0; layer.appendChild(g);
    crew.push({ el:g, x:DOOR_X, st:"in", job:null, timer:0, dir:1, fn:null, workTime:1, speed:CREW_SPEED });
  }
}
const crewQueue = [];
function dispatch(job, fn, workTime = 0.9){
  const c = crew.find(c => c.st === "in");
  if (!c){ crewQueue.push([job, fn, workTime]); return; }
  Object.assign(c, { st:"out", job, fn, timer:0, workTime, x:DOOR_X, speed:CREW_SPEED });
  c.el.style.opacity = 1; c.el.classList.add("walking"); c.el.classList.remove("working","cheer");
}
function recallCrew(){ crew.forEach(c => { if ((c.st === "out" || c.st === "work") && c.job !== "repair"){ if (c.fn){ c.fn(); c.fn = null; } c.st = "back"; c.speed = CREW_SPEED * 1.7; c.el.classList.remove("working"); c.el.classList.add("walking"); } }); }
function updateCrew(dt){
  for (const c of crew){
    if (c.st === "in") continue;
    if (c.st === "out" || c.st === "back"){
      const target = c.st === "out" ? SPOT[c.job] : DOOR_X;
      const d = target - c.x, stepX = c.speed * dt;
      c.dir = d >= 0 ? 1 : -1;
      if (Math.abs(d) <= stepX){
        c.x = target;
        if (c.st === "out"){ c.st = "work"; c.timer = 0; c.el.classList.remove("walking"); c.el.classList.add("working"); spark(SPOT[c.job] + 18, WALK_Y - 50); }
        else { c.st = "in"; c.el.style.opacity = 0; c.el.classList.remove("walking"); if (crewQueue.length) dispatch(...crewQueue.shift()); }
      } else c.x += stepX * c.dir;
    } else if (c.st === "work"){
      c.timer += dt;
      if (c.fn && c.timer > 0.45){ c.fn(); c.fn = null; }
      const holding = c.job === "repair" && G.S && G.S.repairLeft > 0;
      if (!holding && c.timer > c.workTime){ c.st = "back"; c.el.classList.remove("working"); c.el.classList.add("walking"); }
      if (holding && Math.random() < dt * 3) spark(SPOT.repair + 20, WALK_Y - 40);
      c.dir = 1;
    }
    c.el.setAttribute("transform", `translate(${c.x.toFixed(1)},${WALK_Y})`);
    c.el.firstElementChild.setAttribute("transform", c.dir < 0 ? "scale(-1,1)" : "");
  }
}
function floaty(x, y, text, color){
  const t = document.createElementNS(SVGNS, "text"); t.setAttribute("x", x); t.setAttribute("y", y); t.setAttribute("text-anchor","middle");
  t.setAttribute("class","float"); t.setAttribute("fill", color); t.setAttribute("stroke","#15122a"); t.setAttribute("stroke-width","4"); t.setAttribute("paint-order","stroke");
  t.textContent = text; $("#fx").appendChild(t); setTimeout(() => t.remove(), 1500);
}
function spark(x, y){
  const g = document.createElementNS(SVGNS, "g"); g.setAttribute("transform", `translate(${x},${y})`);
  g.innerHTML = `<g class="spark" style="transform-box:fill-box;transform-origin:center"><path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2Z" fill="#ffe08a"/></g>`;
  $("#fx").appendChild(g); setTimeout(() => g.remove(), 520);
}

/* ===================== rover & ambient ===================== */
const rover = { x:-300, active:false, wait:6, dir:1 };
function updateRover(dt, day){
  if (!rover.active){ rover.wait -= dt; if (rover.wait <= 0 && day > 0.5){ rover.active = true; rover.dir = Math.random() < .5 ? 1 : -1; rover.x = rover.dir > 0 ? -260 : 1460; } }
  else { rover.x += rover.dir * 46 * dt; if (rover.x > 1480 || rover.x < -280){ rover.active = false; rover.wait = 35 + Math.random()*30; } }
  $("#rover").setAttribute("transform", `translate(${rover.x.toFixed(1)},0) scale(${rover.dir},1)`);
}

/* ===================== game state ===================== */
const G = { diff:"cadet", progress:{ cadet:{}, commander:{} }, unlockAll:false, S:null, L:null, speed:1, modal:false, running:false,
  hist:[], marks:[], fired:{}, pred:{ batEmpty:null, airEmpty:null }, pending:{}, demoT:9, lastHud:0, lastPred:0, cp:10, cpT:6,
  predBad:false, predWarnT:-9, firstSeen:{}, fullWarnT:-9, alarm:false, histT:0 };
function loadProgress(){ try { const p = JSON.parse(localStorage.getItem("rpo-v2") || "null"); if (p){ G.progress = p.progress || G.progress; G.diff = p.diff || "cadet"; G.unlockAll = !!p.unlockAll; } } catch(e){} }
function saveProgress(){ try { localStorage.setItem("rpo-v2", JSON.stringify({ progress:G.progress, diff:G.diff, unlockAll:G.unlockAll })); } catch(e){} }
// A level opens only when every level before it has been finished in order.
const unlocked = n => G.unlockAll || n === 1 || (unlocked(n - 1) && (G.progress[G.diff][n - 1] || 0) > 0);

/* ===================== scene render ===================== */
function renderScene(){
  const S = G.S, running = !!S;
  const t = running ? S.t : G.demoT, h = hourOf(t), L = running ? S.L : LEVELS[0];
  const sun = sunElev(h), stormAmt = running ? L.storm(t) : 0;
  const day = clamp(sun * 3.2, 0, 1);
  const dh = Math.min(Math.abs(h - 6), Math.abs(h - 18)), tw = clamp(1 - dh / 1.2, 0, 1);
  let top = mix("#05061a", "#b07650", day), bot = mix("#1b1839", "#e2b98e", day);

/* ===================== thought bubbles (follow the thing they belong to) ===================== */
const bubbles = [];
function bubble(key, anchor, text, secs = 7){
  const old = bubbles.find(b => b.key === key);
  if (old){ removeBubble(old); if (old.fromTap) return; }        // tapping again closes it
  while (bubbles.length >= 1) removeBubble(bubbles[0]);
  const el = document.createElement("div"); el.className = "bubble"; el.innerHTML = text; $("#bubbles").appendChild(el);
  const b = { key, anchor, el, until: performance.now() + secs * 1000, fromTap: true }; bubbles.push(b); placeBubble(b);
  return b;
}

function placeBubble(b){
  const r = anchorRect(b.anchor); if (!r) return;
  const st = $("#stage").getBoundingClientRect(), w = b.el.offsetWidth, h = b.el.offsetHeight;
  const cx = r.left + r.width / 2 - st.left;
  let left = clamp(cx - 34, 8, st.width - w - 8), top = r.top - st.top - h - 26, below = false;
  if (top < 6){ top = r.bottom - st.top + 26; below = true; }
  b.el.style.left = left + "px"; b.el.style.top = top + "px"; b.el.classList.toggle("below", below);
  b.el.style.setProperty("--tx", clamp(cx - left, 18, w - 18) + "px");
}
function updateBubbles(){

  }
}

  }
  if (L.breakAt) once("brk", t >= L.breakAt, breakdownCard);
  if (G.modal) return;
  // ---- physics ----
  const ev = step(S, d);
  ev.forEach(e => {
    if (e === "shed"){ G.pending = {}; toast("⚡ <b>Battery empty!</b> The base switched off everything except the heaters. Only sunlight is running the base now.", "bad", 8); }

      const at = { brush:170, insul:560, pack:560, filter:380 }[Rw.key]; floaty(at, 300, `${Rw.icon} ${Rw.name}`, "#ffc94a"); spark(at, 340); spark(at + 30, 360); }

  }
  if (S.bat >= S.cap - 0.01 && S.last.net > 1 && S.t - G.fullWarnT > 4){ G.fullWarnT = S.t; toast(`☀ <b>Battery full!</b> Spare sunshine is going to waste. ${cadet() ? "You could switch on the lab." : ""}`, "sun", 8); }
  once("air2", S.air < 2 && S.air > 0, () => toast(`🫧 <b>Air tank low:</b> ${fmt1(S.air)} kg left, about ${dur(S.air / M.crewO2)}. ${cadet() ? "Switch on the air maker!" : ""}`, "bad", 8));
  once("air1", S.air < 1 && S.air > 0, () => toast("🫧 <b>Air tank almost empty!</b>", "bad", 8));
  once("airAll", S.airMade >= M.crewO2 * 24, () => toast(`🫧 <b>All 4 crew have their air for today!</b> Anything extra goes into the tank as spare.`, "good", 8));
  once("light", S.light >= M.lightNeed, () => toast(`🌱 <b>The plants have had ${M.lightNeed} hours of light today.</b> You can switch the grow lights off.`, "good", 7));
  for (const Gl of L.goals) if (Gl.k === "sent" || Gl.k === "made") once("g" + Gl.k, (Gl.k === "sent" ? S.sent : S.made) >= Gl.v, () => toast(`⭐ <b>Goal done:</b> ${Gl.label.toLowerCase()}!`, "good"));
  if (S.fail) return endLevel(false);

}

  const airTxt = p => p.airFullAt !== null ? (p.airFullAt <= 24 ? `all 4 bars full by ${hhmm(p.airFullAt)} ✓` : `all 4 full at ${hhmm(p.airFullAt)}, after midnight`) : `${Math.min(4, Math.floor(p.airMade / perBar + 1e-6))} of 4 bars by sunrise`;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="Battery level and solar power through the sol">

  const tw = $("#toasts"), stage = box.offsetParent;
  if (tw && stage && getComputedStyle(box).position === "absolute"){
    const br = box.getBoundingClientRect(), stRect = stage.getBoundingClientRect(), twW = tw.getBoundingClientRect().width;
    const clash = br.right > stRect.right - 16 - twW - 8;
    const want = clash ? Math.round(br.bottom - stRect.top + 8) + "px" : "";
    if (tw.style.top !== want) tw.style.top = want;
  } else if (tw && tw.style.top) tw.style.top = "";
  const labRunning = S.last.parts && S.last.parts.lab > 0, allDone = S.mgDone.length >= MG_KEYS.length, d = solProg(S);
  const btn = $("#mgBtn"), ready = S.samples > 0 && G.running && !allDone;
  btn.disabled = !ready; btn.classList.toggle("ready", ready);
  const lbl = allDone ? "🔬 All experiments done" : `🔬 Do an experiment${ready && S.samples > 1 ? " (2)" : ""}`;
  if (btn.textContent !== lbl) btn.textContent = lbl;
  let sub;
  if (allDone) sub = `You've done all ${MG_KEYS.length} experiments this sol!`;
  else if (S.samples >= 2) sub = "Sample tray full! Do an experiment to make room.";
  else if (labRunning) sub = `Collecting a rock sample… ${Math.round(S.labProg / sampleHours(S) * 100)}%`;
  else if (S.on.lab && S.on.shelter) sub = "Lab paused while the crew shelters.";
  else if (S.on.lab && S.repairLeft > 0) sub = "Lab paused during the repair.";
  else sub = "Switch on the lab to collect rock samples.";
  sub += `<br>Done ${S.mgDone.length}/${MG_KEYS.length} · Now: <b>${mgTier(d)}</b>`;
  const sb = $("#sbSub"); if (sb.innerHTML !== sub) sb.innerHTML = sub;
  $("#sbNext").style.width = (allDone ? 100 : S.samples >= 2 ? 100 : clamp(S.labProg / sampleHours(S) * 100, 0, 100)) + "%";
}

/* ===================== lab experiment minigames ===================== */
/* Each game gets d (0..1): how far through the sol it is. Later = harder. Each game returns a score 0..3; 0 = failed. */
function openExperiment(){
  const S = G.S; if (!S || !G.running || G.modal || !(S.samples > 0)) return;
  const left = MG_KEYS.filter(k => !S.mgDone.includes(k)); if (!left.length) return;
  const pick = left[Math.floor(Math.random() * left.length)];
  G.mg = { id: Math.random(), game: pick, d: solProg(S) };
  ({ rocks: mgRocks, scope: mgScope, tubes: mgTubes, weather: mgWeather, craters: mgCraters, devils: mgDevils, moxie: mgMoxie, rover: mgRover })[pick]();
}
function mgHead(title, sub){
  const d = G.mg.d;
  return `<div class="mg-head"><div><div class="eyebrow">🔬 Lab experiment ${G.S.mgDone.length + 1} of ${MG_KEYS.length}</div><h2>${title}</h2></div><span class="mg-pill">❚❚ Time is paused</span></div>
  <div class="mg-rules"><span class="mg-pill">Difficulty: <b>${mgTier(d)}</b></span><span class="mg-pill" style="color:var(--ok)">Win: +1 to +3 ⭐</span><span class="mg-pill" style="color:var(--alarm)">Fail: −${mgPenalty(d)} ⭐</span></div><p>${sub}</p>`;
}
const scoreFromFrac = f => f >= .999 ? 3 : f >= .75 ? 2 : f >= .5 ? 1 : 0;
function mgFinish(score, fact, src, why = ""){
  const S = G.S; if (!S || !G.mg) return;
  const key = G.mg.game, d = G.mg.d; G.mg = null;
  S.samples = Math.max(0, S.samples - 1); S.mgPlayed++; if (!S.mgDone.includes(key)) S.mgDone.push(key);
  let html;
  if (score >= 1){
    const pts = clamp(Math.round(score), 1, 3); S.bonus += pts; S.made += pts;
    if (S.L.dish) S.stored += pts; else S.sent = S.made;
    html = `<h2>${pts === 3 ? "Brilliant science!" : pts === 2 ? "Nice work!" : "You passed!"}</h2><div class="mg-score">+${pts} science ${"⭐".repeat(pts)}</div>
      ${S.L.dish ? `<p style="text-align:center">Earth only gets it once the <b>radio dish</b> sends it during a satellite pass.</p>` : ""}`;
    setTimeout(() => { floaty(SPOT.lab + 30, WALK_Y - 110, `+${pts} ⭐`, "#ffc94a"); }, 60);
  } else {
    const loss = mgPenalty(d); let lost;
    if (S.L.dish){ let left = loss; const a = Math.min(S.stored, left); S.stored -= a; left -= a; const b = Math.min(S.sent, left); S.sent -= b; left -= b; lost = loss - left; S.made = Math.max(0, S.made - lost); }
    else { lost = Math.min(loss, S.made); S.made -= lost; S.sent = S.made; }
    S.lost += lost; G.sbShake = true;
    html = `<h2>Experiment failed</h2><div class="mg-score" style="color:var(--alarm)">${lost ? `−${lost} science` : "No points lost"}</div>
      <p style="text-align:center">${why ? why + " " : ""}The bad results had to be thrown away${lost ? (S.L.dish ? ", so some of your science points were taken off" : "") : ", but you didn't have any points to lose yet"}.</p>`;
    setTimeout(() => { floaty(SPOT.lab + 30, WALK_Y - 110, `−${lost} ⭐`, "#ff5468"); }, 60);
  }
  openModal(`<div class="eyebrow">🔬 ${MG_NAME[key]} · ${S.mgDone.length} of ${MG_KEYS.length} done this sol</div>${html}
    <div class="fact"><b>Real science:</b> ${fact}<span class="src">Source: ${src}</span></div>
    <div class="row end"><button class="btn" data-act="close" data-focus>Back to the base ▶</button></div>`);
  setTimeout(renderHud, 70);
}
function mgTimer(id, secs, onTick, onEnd){            // countdown that stops if the game is gone
  const t0 = performance.now();
  const loop = now => { if (!G.mg || G.mg.id !== id) return; const left = secs - (now - t0) / 1000;
    if (left <= 0){ onTick(0); onEnd(); return; } onTick(left); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
const timerBar = `<div class="tbar"><i id="mgTime"></i></div>`;
function setTime(left, secs){ const el = $("#mgTime"); if (el){ el.style.width = (left / secs * 100) + "%"; el.style.background = left < secs * .25 ? "var(--alarm)" : "var(--solar)"; } }
const noFocus = () => document.activeElement && document.activeElement.blur();

/* 1. Rock detective: made in water or by a volcano? */
const ROCKS = [
  { n:"Layered sandstone", e:"🟫", d:"Thin, flat layers, like the pages of a book.", a:"water", why:"Layers like these form when sand settles, bit by bit, at the bottom of a lake or river." },
  { n:"Rounded pebbles", e:"🫘", d:"Smooth, round pebbles cemented together.", a:"water", why:"Flowing water rolls pebbles until they're round. Curiosity found rocks like this from an old Mars stream bed." },
  { n:"Mudstone", e:"🟤", d:"Very fine mud that has turned to stone.", a:"water", why:"Fine mud only settles out in calm water, like a lake." },
  { n:"Rock with white veins", e:"⚪", d:"Bright white lines of salty minerals inside cracks.", a:"water", why:"Water flowed through the cracks and left minerals behind." },
  { n:"Bubbly dark rock", e:"⚫", d:"Dark grey rock full of tiny holes.", a:"volcano", why:"The holes are gas bubbles trapped when hot lava cooled down." },
  { n:"Green-crystal rock", e:"🟢", d:"Packed with green crystals called olivine.", a:"volcano", why:"Olivine crystals grow in hot, melted rock. Perseverance found olivine-rich volcanic rock on Jezero's floor." },
  { n:"Glassy black rock", e:"⬛", d:"Shiny and black, like dark glass.", a:"volcano", why:"Lava that cools very fast turns into natural glass." }
];
function mgRocks(){
  const id = G.mg.id, n = 4 + Math.round(G.mg.d * 2), set = [...ROCKS].sort(() => Math.random() - .5).slice(0, n); let i = 0, right = 0;
  const show = () => {
    if (!G.mg || G.mg.id !== id) return;
    if (i >= set.length) return mgFinish(scoreFromFrac(right / n),
      "About 3.5 billion years ago, Jezero Crater held a lake with a river flowing in. Perseverance has found rocks made in that water and rocks made from volcanic lava. Rocks made in water are where scientists look hardest for signs of ancient life.",
      "NASA/JPL Perseverance mission results", `You got ${right} of ${n} right. You need at least half.`);
    const r = set[i];
    openModal(mgHead("Rock detective", `Jezero Crater was once a lake. Was each rock <b>made in water</b> or <b>made by a volcano</b>? Get at least ${Math.ceil(n / 2)} of ${n} right to pass.`) +
      `<div class="mg-card"><div class="mg-pill" style="display:inline-block">Rock ${i + 1} of ${n} · ${right} right</div><div class="big" aria-hidden="true">${r.e}</div><h3>${r.n}</h3><div>${r.d}</div>
       <div class="mg-btns"><button data-ans="water">💧 Made in water</button><button data-ans="volcano">🌋 Made by a volcano</button></div><div class="mg-fb" id="mgFb"></div></div>`);
    noFocus();
    $("#box").querySelectorAll("[data-ans]").forEach(b => b.onclick = () => {
      const ok = b.dataset.ans === r.a; if (ok) right++;
      $("#box").querySelectorAll("[data-ans]").forEach(x => x.disabled = true);
      const fb = $("#mgFb"); fb.className = "mg-fb " + (ok ? "ok" : "no");
      fb.innerHTML = (ok ? "✔ Correct! " : `✘ It was made ${r.a === "water" ? "in water" : "by a volcano"}. `) + `<span style="font-weight:400;color:var(--ink)">${r.why}</span><div class="row end" style="margin-top:8px"><button class="btn" id="mgNext">${i + 1 < n ? "Next rock ▶" : "See results ▶"}</button></div>`;
      $("#mgNext").onclick = () => { i++; show(); }; $("#mgNext").focus();
    });
  };
  show();
}

/* 2. Microscope focus: stop the marker in the green zone */
function mgScope(){
  const id = G.mg.id, d = G.mg.d, zones = [0.30, 0.24, 0.18].map(z => z * (1 - 0.3 * d)), speeds = [1.5, 1.9, 2.3].map(v => v * (1 + 0.4 * d)), GRACE = 0.03;
  let round = 0, hits = 0, t0 = performance.now(), pos = 0, lock = false;
  let grains = ""; for (let k = 0; k < 46; k++){ const x = Math.random() * 200, y = Math.random() * 200, r = 4 + Math.random() * 12, c = ["#c8743f","#8a4a26","#e3a56b","#5a2b14","#f0d2a8","#9b9089"][k % 6]; grains += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(0)}" fill="${c}"/>`; }
  openModal(mgHead("Microscope focus", "Your close-up camera is looking at a rock. Press <b>Focus!</b> when the yellow marker is inside the <b style='color:var(--ok)'>green zone</b>. 3 tries. Miss all 3 and the experiment fails.") +
    `<div class="mg-card"><div class="mg-pill" style="display:inline-block" id="scRound">Try 1 of 3 · 0 sharp</div>
     <div class="scope"><svg viewBox="0 0 200 200" id="scImg" style="filter:blur(9px)" aria-hidden="true"><rect width="200" height="200" fill="#7a3d1f"/>${grains}</svg></div>
     <div class="fbar"><div class="zone" id="scZone"></div><div class="mark" id="scMark"></div></div>
     <button class="btn" id="scTap" data-focus style="min-width:220px;min-height:60px;font-size:1.3rem;touch-action:manipulation">🔍 Focus!</button><div style="font-size:.8rem;color:var(--muted);margin-top:6px">Tip: you can also press the Space bar.</div><div class="mg-fb" id="mgFb"></div></div>`);
  const setZone = () => { const w = zones[round]; G.mg.z0 = clamp(0.5 - w / 2 + (Math.random() - .5) * 0.5, 0.04, 0.96 - w); G.mg.z1 = G.mg.z0 + w; const z = $("#scZone"); z.style.left = G.mg.z0 * 100 + "%"; z.style.width = w * 100 + "%"; };
  setZone();
  const posAt = now => (Math.sin((now - t0) / 1000 * speeds[round]) + 1) / 2;
  const loop = now => { if (!G.mg || G.mg.id !== id || !G.modal) return; if (!lock){ pos = posAt(performance.now()); const m = $("#scMark"); if (m) m.style.left = pos * 100 + "%"; } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const press = e => {
    if (e){ e.preventDefault(); }
    if (lock || !G.mg || G.mg.id !== id) return; lock = true;
    pos = posAt(performance.now()); const m = $("#scMark"); if (m) m.style.left = pos * 100 + "%";   // judge exactly where the marker is at the moment of the press
    const ok = pos >= G.mg.z0 - GRACE && pos <= G.mg.z1 + GRACE; if (ok) hits++;
    $("#scImg").style.filter = `blur(${[9, 5, 2, 0][hits]}px)`;
    const fb = $("#mgFb"); fb.className = "mg-fb " + (ok ? "ok" : "no"); fb.textContent = ok ? "✔ Sharp! You can see more tiny grains." : "✘ Still blurry. Watch the marker!";
    setTimeout(() => { if (!G.mg || G.mg.id !== id) return; round++;
      if (round >= 3) return mgFinish(hits, "Perseverance has a close-up camera called WATSON on its robotic arm. Instruments called PIXL and SHERLOC study rocks at details smaller than a grain of sand, looking for clues that tiny living things once lived in the lake.", "NASA/JPL Perseverance instruments", "The picture never came into focus.");
      $("#scRound").textContent = `Try ${round + 1} of 3 · ${hits} sharp`; fb.textContent = ""; setZone(); t0 = performance.now(); lock = false; }, 900);
  };
  $("#scTap").addEventListener("pointerdown", press);                              // fires the instant the finger/mouse goes down
  $("#scTap").addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") press(e); });
}

/* 3. Sample tubes: put the steps in order */
function mgTubes(){
  const id = G.mg.id, d = G.mg.d;
  const STEPS = (d >= 0.4 ? ["🔍 Choose a rock worth sampling"] : []).concat(["🛠 Drill into the rock", "🧪 Collect the rock core in a tube", "🔒 Seal the tube tight", "📦 Leave the tube on the ground for a future mission"]);
  const maxMiss = d < .5 ? 3 : 2;
  let next = 0, miss = 0; const order = [...STEPS.keys()].sort(() => Math.random() - .5);
  const draw = () => {
    if (!G.mg || G.mg.id !== id) return;
    openModal(mgHead("Sample tubes", `Perseverance collects rock cores to send to Earth one day. <b>Tap the ${STEPS.length} steps in the right order.</b> More than ${maxMiss} mistakes and the sample is ruined.`) +
      `<div class="mg-card"><ol class="steps-done">${STEPS.map((s, k) => `<li class="${k < next ? "" : "todo"}">${k < next ? `${k + 1}. ${s}` : `${k + 1}. ?`}</li>`).join("")}</ol>
       <div class="mg-opts">${order.filter(k => k >= next).map(k => `<button class="mg-opt" data-step="${k}">${STEPS[k]}</button>`).join("")}</div>
       <div class="mg-fb no" id="mgFb">${miss ? `Mistakes: ${miss} of ${maxMiss} allowed` : ""}</div></div>`);
    noFocus();
    $("#box").querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
      if (+b.dataset.step === next){ next++; if (next >= STEPS.length) return mgFinish(miss === 0 ? 3 : miss === 1 ? 2 : 1,
        "Perseverance drills out rock cores about the size of a piece of chalk and seals each one in a tube. In 2022–23 it left 10 tubes on the ground at a place called Three Forks, as a backup for a future mission to bring samples to Earth.",
        "NASA/JPL Mars sample collection"); draw(); }
      else { miss++;
        if (miss > maxMiss) return mgFinish(0, "Perseverance drills out rock cores about the size of a piece of chalk and seals each one in a tube, so they stay clean for scientists on Earth.", "NASA/JPL Mars sample collection", "Too many mistakes: the tube got dirty.");
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); $("#mgFb").textContent = `Not yet! Which step comes ${next === 0 ? "first" : "next"}? (Mistakes: ${miss} of ${maxMiss} allowed)`; }
    });
  };
  draw();
}

/* 4. Weather detective: read the base's temperature log */
function mgWeather(){
  const id = G.mg.id, d = G.mg.d, tol = d < .5 ? 1 : 0;
  const qs = [{ q:"Tap the <b>coldest</b> hour of the sol.", fn:"min" }, { q:"Tap the <b>warmest</b> hour of the sol.", fn:"max" }].sort(() => Math.random() - .5);
  let qi = 0, right = 0;
  const minH = TEMP.indexOf(Math.min(...TEMP)), maxH = TEMP.indexOf(Math.max(...TEMP));
  const draw = () => {
    if (!G.mg || G.mg.id !== id) return;
    if (qi >= qs.length) return mgFinish(right === 2 ? 3 : right === 1 ? 1 : 0, "Perseverance has a weather station called MEDA. At Jezero it measured afternoons around −22 °C and nights colder than −80 °C. The coldest time is just before sunrise, after the ground has lost its heat all night.", "Perseverance MEDA (Rodriguez-Manfredi et al., 2023)", "Both answers were off.");
    const Q = qs[qi], ans = Q.fn === "min" ? minH : maxH;
    const cold = Q.fn === "min";
    openModal(mgHead("Weather detective", `Your weather station logged the temperature every hour. <b>Taller bar = warmer, shorter bar = colder.</b> ${tol ? "Within 1 hour counts." : "<b>It has to be the exact hour.</b>"}`) +
      `<div class="wxq ${cold ? "cold" : "warm"}"><span class="wxn">Question ${qi + 1} of 2</span>${cold ? "❄️ Tap the <u>COLDEST</u> hour" : "☀️ Tap the <u>WARMEST</u> hour"}<span class="wxh">${cold ? "Look for the <b>shortest</b> bar" : "Look for the <b>tallest</b> bar"}</span></div>
       <div class="mg-card"><div class="wx" role="group" aria-label="Temperature for each hour">${TEMP.map((v, h) => `<button data-h="${h}" style="height:${((v + 92) / 75 * 100).toFixed(0)}%;background:${mix("#5aa9ff", "#ffb347", (v + 84) / 62)}" aria-label="${String(h).padStart(2, "0")}:00"></button>`).join("")}</div>
       <div class="wxl">${[0, 3, 6, 9, 12, 15, 18, 21].map(h => `<span style="left:${((h + .5) / 24 * 100).toFixed(2)}%">${String(h).padStart(2, "0")}:00</span>`).join("")}</div><div class="mg-fb" id="mgFb"></div></div>`);
    noFocus();
    $("#box").querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
      const h = +b.dataset.h, ok = Math.abs(h - ans) <= tol; if (ok) right++;
      $("#box").querySelectorAll("[data-h]").forEach(x => x.disabled = true); b.classList.add("pick"); $(`#box [data-h="${ans}"]`).classList.add("ans");
      const fb = $("#mgFb"); fb.className = "mg-fb " + (ok ? "ok" : "no");
      fb.style.fontSize = "1.15rem";
      fb.innerHTML = `${ok ? "✔ Yes!" : "✘ Not quite."} You picked ${String(h).padStart(2, "0")}:00 (${TEMP[h]} °C). The ${Q.fn === "min" ? "coldest" : "warmest"} hour was <b>${String(ans).padStart(2, "0")}:00</b> at <b>${TEMP[ans]} °C</b>.<div class="row end" style="margin-top:8px"><button class="btn" id="mgNext">${qi + 1 < qs.length ? "Next question ▶" : "See results ▶"}</button></div>`;
      $("#mgNext").onclick = () => { qi++; draw(); }; $("#mgNext").focus();
    });
  };
  draw();
}

/* 5. Crater counter: tap every crater before time runs out (don't tap plain rocks) */
function mgCraters(){
  const id = G.mg.id, d = G.mg.d, N = 8 + Math.round(d * 6), R = Math.round(d * 5), secs = 14 - 4 * d;
  const pts = []; let guard = 0;
  while (pts.length < N + R && guard++ < 2000){ const r = 9 + Math.random() * 10, x = r + 4 + Math.random() * (320 - 2 * r - 8), y = r + 4 + Math.random() * (200 - 2 * r - 8);
    if (pts.every(p => Math.hypot(p.x - x, p.y - y) > p.r + r + 6)) pts.push({ x, y, r, rock: pts.length >= N }); }
  let found = 0, wrong = 0, over = false;
  const svg = pts.map((p, i) => p.rock
    ? `<g data-c="${i}" class="cr"><ellipse cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" rx="${(p.r * .8).toFixed(0)}" ry="${(p.r * .55).toFixed(0)}" fill="#4a2312"/><ellipse cx="${(p.x - p.r * .2).toFixed(0)}" cy="${(p.y - p.r * .2).toFixed(0)}" rx="${(p.r * .3).toFixed(0)}" ry="${(p.r * .18).toFixed(0)}" fill="#8a5a3a"/></g>`
    : `<g data-c="${i}" class="cr"><circle cx="${p.x.toFixed(0)}" cy="${p.y.toFixed(0)}" r="${p.r.toFixed(0)}" fill="#7a3a1c" stroke="#e7a77a" stroke-width="3"/><circle cx="${(p.x + p.r * .15).toFixed(0)}" cy="${(p.y + p.r * .15).toFixed(0)}" r="${(p.r * .65).toFixed(0)}" fill="#5c2a13"/></g>`).join("");
  openModal(mgHead("Crater counter", `An orbiter photo of the ground near your base. <b>Tap every crater</b> (round holes with a bright rim) before time runs out.${R ? " <b>Don't tap the plain rocks!</b>" : ""} Find at least half to pass.`) +
    `<div class="mg-card">${timerBar}<div class="mg-pill" style="display:inline-block" id="crCount">Found 0 of ${N}</div>
     <svg viewBox="0 0 320 200" class="crmap" role="group" aria-label="Ground photo"><rect width="320" height="200" fill="#a8562c"/>${svg}</svg><div class="mg-fb" id="mgFb"></div></div>`);
  noFocus();
  const end = () => { if (over) return; over = true; const f = Math.max(0, found - wrong) / N;
    mgFinish(scoreFromFrac(f), "Planetary scientists estimate how old a patch of ground is by counting its craters. Ground with more craters has been sitting there longer, collecting hits from space rocks. Scientists have used crater counts to date the rocks of Jezero Crater.", "NASA planetary science; crater-count dating of Jezero", `You found ${found} of ${N}${wrong ? ` and tapped ${wrong} rock${wrong > 1 ? "s" : ""}` : ""}.`); };
  $("#box").querySelectorAll("[data-c]").forEach(g => g.onclick = () => {
    if (over || g.dataset.done) return; g.dataset.done = 1; const p = pts[+g.dataset.c];
    if (p.rock){ wrong++; g.innerHTML += `<text x="${p.x}" y="${p.y + 5}" text-anchor="middle" font-size="16" fill="#ff5468">✘</text>`; $("#mgFb").className = "mg-fb no"; $("#mgFb").textContent = "That's a rock, not a crater!"; }
    else { found++; g.innerHTML += `<circle cx="${p.x}" cy="${p.y}" r="${p.r + 3}" fill="none" stroke="#6be3a4" stroke-width="3"/>`; $("#crCount").textContent = `Found ${found} of ${N}`; $("#mgFb").textContent = ""; if (found === N) end(); }
  });
  mgTimer(id, secs, l => setTime(l, secs), end);
}

/* 6. Dust-devil watch: tap dust devils before they vanish */
function mgDevils(){
  const id = G.mg.id, d = G.mg.d, K = 8 + Math.round(d * 4), life = 1.6 - 0.65 * d, gap = 1.05 - 0.35 * d;
  let spawned = 0, caught = 0, over = false;
  openModal(mgHead("Dust-devil watch", `Your weather camera is watching the crater floor. <b>Tap each dust devil</b> before it disappears to record it. Catch at least half to pass.`) +
    `<div class="mg-card"><div class="mg-pill" style="display:inline-block" id="dvCount">Recorded 0 · 0 of ${K} seen</div><div class="dvfield" id="dvField"></div><div class="mg-fb" id="mgFb"></div></div>`);
  noFocus();
  const field = $("#dvField");
  const spawn = () => {
    if (!G.mg || G.mg.id !== id || over) return;
    if (spawned >= K){ setTimeout(() => { if (!G.mg || G.mg.id !== id || over) return; over = true; mgFinish(scoreFromFrac(caught / K), "Perseverance's weather sensors and cameras have recorded many dust devils at Jezero, some more than 100 metres wide. They help scientists understand how wind lifts dust into the Martian air.", "Perseverance MEDA (Rodriguez-Manfredi et al., 2023)", `You recorded ${caught} of ${K} dust devils.`); }, life * 1000 + 100); return; }
    spawned++; const b = document.createElement("button"); b.className = "devil"; b.setAttribute("aria-label", "Dust devil"); b.textContent = "🌪";
    b.style.left = (5 + Math.random() * 82) + "%"; b.style.top = (8 + Math.random() * 62) + "%"; b.style.animationDuration = life + "s";
    b.onclick = () => { if (b.dataset.hit) return; b.dataset.hit = 1; caught++; b.classList.add("hit"); b.textContent = "✔"; $("#dvCount").textContent = `Recorded ${caught} · ${spawned} of ${K} seen`; };
    field.appendChild(b); setTimeout(() => b.remove(), life * 1000);
    $("#dvCount").textContent = `Recorded ${caught} · ${spawned} of ${K} seen`;
    setTimeout(spawn, gap * 1000 * (0.7 + Math.random() * 0.6));
  };
  setTimeout(spawn, 600);
}

/* 7. Oxygen maker: split CO2 to collect oxygen; avoid the CO waste */
function mgMoxie(){
  const id = G.mg.id, d = G.mg.d, target = 3 + Math.round(d * 2), secs = 16 - 4 * d, shuffleEvery = 1.7 - 0.6 * d, pCO = 0.3 + 0.2 * d;
  let O = 0, over = false;
  openModal(mgHead("Oxygen maker", `Mars air is mostly carbon dioxide (CO₂). <b>Tap the CO₂ bubbles</b> to split them and collect oxygen atoms (O). Two O atoms make one O₂ for the crew to breathe. <b>Don't tap CO</b>: it's waste, and you'll lose an atom. Make <b>${target} O₂</b> before time runs out. Get at least half to pass.`) +
    `<div class="mg-card">${timerBar}<div class="mg-pill" style="display:inline-block" id="mxCount">O₂ made: 0 of ${target}</div><div class="mxgrid" id="mxGrid"></div><div class="mg-fb" id="mgFb"></div></div>`);
  noFocus();
  const grid = $("#mxGrid");
  const fill = () => { if (!G.mg || G.mg.id !== id || over) return;
    grid.innerHTML = Array.from({ length:12 }, () => { const co = Math.random() < pCO; return `<button class="mx ${co ? "co" : ""}" data-co="${co ? 1 : 0}">${co ? "CO" : "CO₂"}</button>`; }).join("");
    grid.querySelectorAll(".mx").forEach(b => b.onclick = () => {
      if (over || b.disabled) return; b.disabled = true;
      if (b.dataset.co === "1"){ O = Math.max(0, O - 1); b.classList.add("bad"); $("#mgFb").className = "mg-fb no"; $("#mgFb").textContent = "That was CO waste! −1 O atom"; }
      else { O++; b.classList.add("done"); b.textContent = "+O"; $("#mgFb").textContent = ""; }
      const o2 = Math.floor(O / 2); $("#mxCount").textContent = `O₂ made: ${o2} of ${target}${O % 2 ? " (+1 O)" : ""}`;
      if (o2 >= target) end();
    });
    setTimeout(fill, shuffleEvery * 1000);
  };
  const end = () => { if (over) return; over = true;
    mgFinish(scoreFromFrac(Math.floor(O / 2) / target), "The MOXIE experiment on Perseverance did this for real: it split carbon dioxide from the Martian air to make oxygen. Over its mission it made 122 grams, up to 12 grams an hour. The leftover carbon monoxide is waste.", "NASA/JPL MOXIE results (2021–2023)", `You made ${Math.floor(O / 2)} of ${target} O₂.`); };
  fill(); mgTimer(id, secs, l => setTime(l, secs), end);
}

/* 8. Rover route: drive to the sample flag, avoiding sharp rocks and soft sand, within the battery limit */
function mgRover(){
  const id = G.mg.id, d = G.mg.d, n = d >= 0.5 ? 6 : 5, dens = 0.32 + 0.1 * d, minHaz = Math.round(n * n * (0.28 + 0.08 * d));
  const start = [n - 1, 0], goal = [0, n - 1]; let grid, sp;
  const bfs = g => { const q = [[...start, 0]], seen = new Set([start + ""]);
    while (q.length){ const [r, c, k] = q.shift(); if (r === goal[0] && c === goal[1]) return k;
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const R = r + dr, C = c + dc; if (R < 0 || C < 0 || R >= n || C >= n || g[R][C] || seen.has(R + "," + C)) continue; seen.add(R + "," + C); q.push([R, C, k + 1]); } }
    return null; };
  for (let tries = 0; tries < 200; tries++){
    grid = Array.from({ length:n }, (_, r) => Array.from({ length:n }, (_, c) => (r === start[0] && c === start[1]) || (r === goal[0] && c === goal[1]) ? 0 : Math.random() < dens ? (Math.random() < .5 ? "rock" : "sand") : 0));
    sp = bfs(grid); const haz = grid.flat().filter(Boolean).length; if (sp !== null && sp > n && haz >= minHaz) break;
  }
  const budget = sp + (3 - Math.round(2 * d));
  let pos = [...start], moves = 0, over = false;
  const draw = msg => {
    if (!G.mg || G.mg.id !== id) return;
    openModal(mgHead("Rover route", `Drive the rover 🚙 to the sample flag 🚩. <b>Tap a square next to the rover</b> to move. Avoid <b>sharp rocks</b> 🪨 and <b>soft sand</b> 〰️, or you'll get stuck! The battery allows <b>${budget} moves</b>.`) +
      `<div class="mg-card"><div class="mg-pill" style="display:inline-block">Moves: ${moves} of ${budget}</div>
       <div class="rgrid" style="grid-template-columns:repeat(${n},1fr)">${grid.map((row, r) => row.map((cell, c) => {
         const here = pos[0] === r && pos[1] === c, isGoal = goal[0] === r && goal[1] === c, adj = Math.abs(pos[0] - r) + Math.abs(pos[1] - c) === 1;
         return `<button class="rc ${cell || ""} ${adj ? "adj" : ""}" data-r="${r}" data-c="${c}" ${adj && !over ? "" : "disabled"} aria-label="${here ? "rover" : isGoal ? "flag" : cell === "rock" ? "sharp rocks" : cell === "sand" ? "soft sand" : "clear ground"}">${here ? "🚙" : isGoal ? "🚩" : cell === "rock" ? "🪨" : cell === "sand" ? "〰️" : ""}</button>`; }).join("")).join("")}</div>
       <div class="mg-fb ${msg ? "no" : ""}" id="mgFb">${msg || ""}</div></div>`);
    noFocus();
    $("#box").querySelectorAll(".rc.adj:not([disabled])").forEach(b => b.onclick = () => {
      if (over) return; const r = +b.dataset.r, c = +b.dataset.c; moves++; pos = [r, c];
      const fact = "Rover drivers on Earth plan every drive carefully. In 2009 the Spirit rover got stuck in soft sand and never got free, and sharp rocks have punched holes in Curiosity's wheels.", src = "NASA/JPL Spirit and Curiosity missions";
      if (grid[r][c] === "rock"){ over = true; return mgFinish(0, fact, src, "The rover drove onto sharp rocks and damaged a wheel."); }
      if (grid[r][c] === "sand"){ over = true; return mgFinish(0, fact, src, "The rover got stuck in soft sand."); }
      if (r === goal[0] && c === goal[1]){ over = true; return mgFinish(moves <= sp ? 3 : moves <= sp + 1 ? 2 : 1, fact, src); }
      if (moves >= budget){ over = true; return mgFinish(0, fact, src, "The rover's battery ran out before it reached the flag."); }
      draw();
    });
  };
  draw();
}


/* ===================== loop ===================== */
let lastTs = 0;
function frame(ts){
  const dtReal = Math.min(0.1, lastTs ? (ts - lastTs) / 1000 : 0); lastTs = ts; G.frameDt = dtReal;
  coachUpdate(dtReal);
  if (G.running && !G.modal && !G.coachPause && G.speed > 0){
    let dh = dtReal * G.speed / SECS_PER_HOUR;
    while (dh > 1e-9 && G.running && !G.modal && !G.coachPause){ const d = Math.min(0.02, dh); dh -= d; tick(d); }
  }
  if (!G.S) G.demoT += dtReal * 0.5;
  updateCrew(dtReal);
  renderScene();
  updateBubbles();
  if (ts - G.lastPred > 450){ G.lastPred = ts; predictionCheck(); }
  if (ts - G.lastHud > 140){ G.lastHud = ts; renderHud(); }
  requestAnimationFrame(frame);
}
function boot(data){
  loadProgress(); if (data && data.progress){ G.progress = data.progress; G.diff = data.diff || G.diff; }
  $("#scene").innerHTML = buildScene(); setupCrew(); showTitle(); requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ progress:G.progress, diff:G.diff }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

</script>
